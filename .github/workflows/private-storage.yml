name: Verify private object storage

on:
  repository_dispatch:
    types: [private-storage-check, private-storage-migrate, private-storage-git-check]

permissions:
  contents: read

concurrency:
  group: ${{ github.event.action == 'private-storage-git-check' && 'private-storage-git-check' || 'private-storage-maintenance' }}
  cancel-in-progress: false

jobs:
  git-restore:
    if: github.event.action == 'private-storage-git-check' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PLAN_DIGEST: ${{ github.event.client_payload.plan_digest }}
      PLAN_SIZE: ${{ github.event.client_payload.plan_size }}
      EXPECTED_READER_BLOB: ${{ github.event.client_payload.reader_blob }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/
            /_system/config/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the deployed reader and mask the proposed R2 objects
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:_system/scripts/private_storage.py)" = "$EXPECTED_READER_BLOB"
          python _system/scripts/verify_private_storage_git.py --plan-digest "$PLAN_DIGEST" --plan-size "$PLAN_SIZE"

  verify:
    if: github.event.action == 'private-storage-check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRIVATE_STORAGE_TEST_TRANSPORT: ${{ github.event.client_payload.transport || 'rest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/
            /_system/config/
            /_system/prompts/valuation_underwriting.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing bounded underwriting verification dependencies
        run: python -m pip install pypdf PyYAML exchange-calendars==4.13.2
      - name: Verify existing approval and private storage round trip
        run: python _system/scripts/private_storage_bootstrap.py check --ticker V --limit 1 --transport "$PRIVATE_STORAGE_TEST_TRANSPORT"

  migrate:
    if: github.event.action == 'private-storage-migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/
            /_system/config/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve complete pinned legacy bytes in resumable verified batches
        run: >-
          python _system/scripts/migrate_private_storage.py
          --repository "$RUNNER_TEMP/private-migration.git"
          --output "$RUNNER_TEMP/private-migration-proof"
          --initialize-repository --release-staging-packs --batch-files 256
