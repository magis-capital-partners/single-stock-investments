name: Auto - Agent PR Merge

# Squash-merge Cursor cloud-agent PRs (Marvin research or Investment Committee
# task artifacts) after research-quality CI passes. Resolves shared-file
# conflicts with main when needed, but never merges in the run that resolved
# them.
#
# Consistency guardrails:
# 1. The gate pins ONE head SHA. Provenance is read at that SHA, the Research
#    quality run for that SHA must succeed, and the SHA is handed to the merge
#    job. Nothing is read by branch name: the branch is deleted when the PR
#    merges, and a twin run still reading it failed with HTTP 404 (AM2).
# 2. The merge job re-verifies every check on the gated SHA
#    (verify_pr_checks.py) and squashes with `sha=<gated SHA>`, so GitHub
#    refuses the merge if the head moved after the gate.
# 3. A conflict-resolver push is never merged in the same run: the new head
#    has never been through CI (PRs #1017 and #1021 were squashed seconds after
#    that push, with zero check runs on the merged head). The push is made with
#    GITHUB_TOKEN, which starts no CI run, so the job says so on the PR and in
#    a warning: someone has to push a commit or close/reopen the PR.
# 4. Squash merges are serialized across all agent PRs (agent-automerge-main).
# 5. PR state is re-read before every side effect. A pull_request run and a
#    workflow_run run fire for the same head; the second one finds the PR
#    merged and stops quietly instead of commenting "blocked" on it.
# 6. The gate's validators and the resolver run from the base branch, never
#    from the PR under review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Research quality gates research PRs. Python tests is the other check most
  # agent PRs run; when it finishes after the merge job gave up waiting on it,
  # its completion is the retry.
  workflow_run:
    workflows: ["Research quality", "Python tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  resolve-pr:
    # Research quality also runs on push and on a schedule against main. Only a
    # pull_request run can make a PR mergeable.
    if: >
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
      eligible: ${{ steps.pr.outputs.eligible }}
      lane: ${{ steps.pr.outputs.lane }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_draft: ${{ steps.pr.outputs.is_draft }}
    steps:
      - name: Resolve PR number and eligibility
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR="$PR_NUMBER"
          else
            PR=$(gh api "repos/${REPO}/commits/${RUN_SHA}/pulls" \
              -H "Accept: application/vnd.github.groot-preview+json" \
              --jq '.[0].number // empty')
            if [ -z "$PR" ]; then
              echo "No open PR for workflow_run SHA ${RUN_SHA}; skipping."
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "number=" >> "$GITHUB_OUTPUT"
              echo "head_ref=" >> "$GITHUB_OUTPUT"
              echo "head_sha=" >> "$GITHUB_OUTPUT"
              echo "is_draft=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          HEAD_REF=$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq '.headRefName')
          IS_DRAFT=$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq '.headRefOid')
          STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR state=$STATE — skipping automerge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
            echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Two automerge lanes. cursor/* carries research/committee artifacts
          # and goes through the provenance gate; codex/* and claude/* are
          # code-agent PRs and gate purely on every CI check being green.
          if [[ "$HEAD_REF" =~ ^cursor/ ]]; then
            LANE="research"
          elif [[ "$HEAD_REF" =~ ^(codex|claude)/ ]]; then
            LANE="code"
          else
            echo "PR #$PR head ref '$HEAD_REF' is not an agent branch (cursor/, codex/, claude/) — skipping automerge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "lane=none" >> "$GITHUB_OUTPUT"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
            echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "lane=$LANE" >> "$GITHUB_OUTPUT"
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"

  gate:
    needs: resolve-pr
    if: needs.resolve-pr.outputs.eligible == 'true' && needs.resolve-pr.outputs.lane == 'research'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: agent-automerge-gate-${{ needs.resolve-pr.outputs.number }}
      cancel-in-progress: true
    outputs:
      number: ${{ needs.resolve-pr.outputs.number }}
      head_ref: ${{ needs.resolve-pr.outputs.head_ref }}
      # Empty unless every check below passed on this exact SHA.
      head_sha: ${{ steps.validated.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ needs.resolve-pr.outputs.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Stop if the PR is no longer open
        id: open
        run: |
          set -euo pipefail
          STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
          if [ "$STATE" = "OPEN" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "PR #$PR is $STATE; nothing to gate."
          fi

      - name: Mark draft PR ready (Cursor cloud agent opens drafts)
        if: steps.open.outputs.open == 'true' && needs.resolve-pr.outputs.is_draft == 'true'
        run: |
          gh pr ready "$PR" --repo "$REPO"

      - name: Confirm PR is ready
        if: steps.open.outputs.open == 'true'
        run: |
          sleep 3
          IS_DRAFT=$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            echo "::error::PR #$PR is still a draft after ready promotion."
            exit 1
          fi

      - name: Pin the head SHA under review
        id: head
        if: steps.open.outputs.open == 'true'
        run: |
          set -euo pipefail
          SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Gating PR #$PR at $SHA"

      - uses: actions/checkout@v4
        if: steps.open.outputs.open == 'true'
        with:
          # Validators come from the base branch, not from the PR under review.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        if: steps.open.outputs.open == 'true'
        with:
          python-version: "3.12"

      - name: Verify immutable agent provenance
        if: steps.open.outputs.open == 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          mapfile -t RESEARCH_TICKERS < <(printf '%s\n' "${FILES[@]}" | sed -nE 's|^([^/]+)/research/research_agent_manifest\.json$|\1|p' | sort -u)
          mapfile -t COMMITTEE_FILES < <(printf '%s\n' "${FILES[@]}" | grep -E '^[^/]+/research/committee_work/' || true)

          if [ "${#RESEARCH_TICKERS[@]}" -gt 0 ]; then
            for TICKER in "${RESEARCH_TICKERS[@]}"; do
              MANIFEST="$(mktemp)"
              STATE="$(mktemp)"
              # Read at the pinned SHA, never the branch name: the branch is
              # deleted when the PR merges (AM2, run 36045846504).
              gh api "repos/$REPO/contents/$TICKER/research/research_agent_manifest.json?ref=$SHA" --jq .content | base64 --decode > "$MANIFEST"
              gh api "repos/$REPO/contents/$TICKER/research/agent_run_state.json?ref=$SHA" --jq .content | base64 --decode > "$STATE"
              python _system/scripts/validate_research_pr_provenance.py --ticker "$TICKER" --manifest "$MANIFEST" --state "$STATE"
            done
            exit 0
          fi

          if [ "${#COMMITTEE_FILES[@]}" -eq 0 ]; then
            echo "::error::Cursor agent PR must include research_agent_manifest.json or committee_work artifacts."
            exit 1
          fi

          # Validation root = main's committee packet + this PR's artifacts at
          # the pinned SHA (a chair synthesis is checked against votes that may
          # have landed on main after the PR forked).
          ROOT_DIR="$RUNNER_TEMP/committee-root"
          mkdir -p "$ROOT_DIR"
          git fetch --depth=1 origin "$SHA"
          mapfile -t PACKETS < <(printf '%s\n' "${COMMITTEE_FILES[@]}" | sed -nE 's|^([^/]+/research/committee_work/[^/]+)/.*$|\1|p' | sort -u)
          for PACKET in "${PACKETS[@]}"; do
            if [ -n "$(git ls-tree -d HEAD -- "$PACKET")" ]; then
              git archive --format=tar HEAD -- "$PACKET" | tar -x -C "$ROOT_DIR"
            fi
          done
          for FILE in "${COMMITTEE_FILES[@]}"; do
            # A file the PR deletes is absent here; the validator reports it.
            if git cat-file -e "$SHA:$FILE" 2>/dev/null; then
              mkdir -p "$ROOT_DIR/$(dirname "$FILE")"
              git cat-file blob "$SHA:$FILE" > "$ROOT_DIR/$FILE"
            fi
          done
          printf '%s\n' "${COMMITTEE_FILES[@]}" | python _system/scripts/validate_committee_pr_artifacts.py --root "$ROOT_DIR"

      - name: Wait for Research quality workflow
        if: steps.open.outputs.open == 'true'
        run: |
          python _system/scripts/wait_for_workflow_run.py \
            --repo "$REPO" \
            --sha "${{ steps.head.outputs.sha }}" \
            --workflow "Research quality" \
            --timeout-seconds 2700 \
            --poll-seconds 15

      - name: Hand the gated SHA to the merge job
        id: validated
        if: steps.open.outputs.open == 'true'
        env:
          SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          if [ "$CURRENT" != "$SHA" ]; then
            echo "Head moved from $SHA to $CURRENT during the gate; the new head is gated by its own run."
            exit 0
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  code-gate:
    # codex/* and claude/* PRs carry code, not research artifacts, so their
    # bar is simpler and stricter in a different direction: EVERY check on the
    # head SHA must complete green. Nothing here bypasses a red check — a
    # failing CI keeps the PR open and the notify job says so on the PR.
    needs: resolve-pr
    if: needs.resolve-pr.outputs.eligible == 'true' && needs.resolve-pr.outputs.lane == 'code'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    concurrency:
      group: agent-automerge-gate-${{ needs.resolve-pr.outputs.number }}
      cancel-in-progress: true
    outputs:
      # Empty unless every check passed on this exact SHA.
      head_sha: ${{ steps.checks.outputs.sha }}
    steps:
      - name: Mark draft PR ready
        if: needs.resolve-pr.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr ready "${{ needs.resolve-pr.outputs.number }}" --repo "${{ github.repository }}" || true

      - name: Wait for every check on the head SHA to pass
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve-pr.outputs.number }}
        run: |
          set -euo pipefail
          # Jobs belonging to this workflow must not gate themselves.
          OWN='^(resolve-pr|gate|code-gate|merge|notify|Resolve PR number and eligibility)$'
          DEADLINE=$(( $(date +%s) + 2700 ))
          # Checks take a minute or two to register. Until this grace period is
          # up, "zero checks" means "not reported yet"; after it, it means the
          # repo's path filters genuinely select nothing for this change (a
          # docs-only PR is the normal case). Blocking those forever is worse
          # than merging them -- the path filters ARE the policy, and PR #876
          # sat unmergeable for 45 minutes proving the point.
          NO_CHECK_GRACE=$(( $(date +%s) + 300 ))
          # Pin ONE SHA: checks are judged on it and the merge is pinned to it.
          SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          echo "Gating PR #$PR at $SHA"
          while :; do
            STATE=$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid -q '.state + " " + .headRefOid')
            if [ "${STATE%% *}" != "OPEN" ]; then
              echo "PR #$PR is ${STATE%% *}; nothing to gate."
              exit 0
            fi
            if [ "${STATE#* }" != "$SHA" ]; then
              echo "Head moved from $SHA to ${STATE#* }; the new head is gated by its own run."
              exit 0
            fi
            RUNS=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs" --jq '.check_runs[] | [.name, .status, (.conclusion // "pending")] | @tsv')
            TOTAL=0; PENDING=0; FAILED=""
            while IFS=$'	' read -r NAME STATUS CONCLUSION; do
              [ -z "$NAME" ] && continue
              if echo "$NAME" | grep -qE "$OWN"; then continue; fi
              TOTAL=$((TOTAL+1))
              if [ "$STATUS" != "completed" ]; then PENDING=$((PENDING+1)); continue; fi
              case "$CONCLUSION" in
                success|neutral|skipped) ;;
                *) FAILED="$FAILED $NAME($CONCLUSION)" ;;
              esac
            done <<< "$RUNS"
            if [ -n "$FAILED" ]; then
              echo "::error::PR #$PR blocked: failing checks:$FAILED"
              exit 1
            fi
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              echo "All $TOTAL checks green for $SHA."
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$TOTAL" -eq 0 ] && [ "$(date +%s)" -ge "$NO_CHECK_GRACE" ]; then
              echo "No CI check applies to $SHA after the grace period; the repo's path filters select nothing for this change. Nothing to verify, so merging."
              echo "sha=$SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::PR #$PR blocked: checks still pending after 45m (total=$TOTAL pending=$PENDING)."
              exit 1
            fi
            echo "checks total=$TOTAL pending=$PENDING — waiting..."
            sleep 20
          done

  merge:
    needs: [resolve-pr, gate, code-gate]
    # Exactly one lane gate runs per PR; merge only the SHA that gate passed.
    if: >-
      !cancelled() &&
      ((needs.gate.result == 'success' && needs.gate.outputs.head_sha != '') ||
       (needs.code-gate.result == 'success' && needs.code-gate.outputs.head_sha != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize squash merges across all agent PRs to avoid main-tip races.
    concurrency:
      group: agent-automerge-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ needs.resolve-pr.outputs.number }}
      REPO: ${{ github.repository }}
      LANE: ${{ needs.resolve-pr.outputs.lane }}
      HEAD_REF: ${{ needs.resolve-pr.outputs.head_ref }}
      GATED_SHA: ${{ needs.gate.outputs.head_sha || needs.code-gate.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The resolver runs from the base branch. It deepens this shallow,
          # blobless clone only until main and the PR branch share a
          # merge-base (a bare fetch-depth 1 broke it: AM3, run 35944388953).
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/
            /_system/memory/daily/
            /_system/portfolio/research_events.jsonl
            /_system/research/milly_log.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skip unless the PR is still open at the gated SHA
        id: state
        run: |
          set -euo pipefail
          STATE=$(gh pr view "$PR" --repo "$REPO" --json state -q .state)
          HEAD=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR already $STATE; nothing to merge."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD" != "$GATED_SHA" ]; then
            echo "PR #$PR head moved from $GATED_SHA to $HEAD after the gate; its own run gates the new head."
            echo "merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve merge conflicts with main, then stop
        id: resolve
        if: steps.state.outputs.merge == 'true'
        run: |
          set -euo pipefail
          MERGEABLE=UNKNOWN
          for _ in 1 2 3 4 5 6; do
            MERGEABLE=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q .mergeable)
            [ "$MERGEABLE" != "UNKNOWN" ] && break
            sleep 5
          done
          if [ "$MERGEABLE" != "CONFLICTING" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LANE" != "research" ]; then
            echo "::error::Code-lane PR #$PR conflicts with main; automerge never auto-resolves code conflicts. Rebase the branch."
            exit 1
          fi
          # The resolver's push is a new, untested head and is never merged in
          # this run. It builds only on the gated SHA and pushes only while the
          # branch is still there (lease pinned to it).
          python _system/scripts/resolve_marvin_pr_conflicts.py "$PR" \
            --expected-sha "$GATED_SHA" --github-output "$RUNNER_TEMP/resolver.out"
          cat "$RUNNER_TEMP/resolver.out" >> "$GITHUB_OUTPUT"
          if grep -qx "pushed=false" "$RUNNER_TEMP/resolver.out" && grep -qx "head_moved=false" "$RUNNER_TEMP/resolver.out"; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Say on the PR that the resolved head needs CI re-triggered
        # A push made with GITHUB_TOKEN starts no CI run (GitHub documents it,
        # and #989, #1017 and #1021 show it), so nothing will test or merge the
        # resolved head until a person pushes or reopens. Say so where it shows.
        if: steps.resolve.outputs.pushed == 'true'
        env:
          PUSHED_SHA: ${{ steps.resolve.outputs.pushed_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MESSAGE="conflicts with main were resolved at ${PUSHED_SHA}. That commit was pushed with GITHUB_TOKEN, which starts no CI run, so nothing will test or merge it on its own. Re-trigger CI: push any commit to this branch, or close and reopen the PR."
          echo "::warning title=Automerge needs CI re-triggered on PR #${PR}::${MESSAGE}"
          python _system/scripts/automerge_comment.py --repo "$REPO" --pr "$PR" \
            --headline "Automerge needs CI re-triggered" --message "$MESSAGE" --run-url "$RUN_URL"

      - name: Verify every check on the gated SHA is green
        id: verify
        if: steps.state.outputs.merge == 'true' && steps.resolve.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          ARGS=(--repo "$REPO" --sha "$GATED_SHA" --exclude-workflow "Auto - Agent PR Merge")
          if [ "$LANE" = "research" ]; then
            ARGS+=(--require-workflow "Research quality")
          else
            # The code gate already accepted a change no path filter selects.
            ARGS+=(--allow-no-checks)
          fi
          # Red fails at once; pending is polled for up to 10 minutes (exit 3).
          CODE=0
          python _system/scripts/verify_pr_checks.py "${ARGS[@]}" --wait-seconds 600 --poll-seconds 30 || CODE=$?
          case "$CODE" in
            0) echo "green=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "pending=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$CODE" ;;
          esac

      - name: Say on the PR that checks are still pending (blocked, will retry)
        if: steps.verify.outputs.pending == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MESSAGE="checks on ${GATED_SHA} were still pending after 10 minutes, so this run did not merge. Automerge retries when Research quality or Python tests next completes for this PR, or on the next push; a check from any other workflow needs a push or a re-run."
          echo "::warning title=Automerge is waiting on PR #${PR}::${MESSAGE}"
          python _system/scripts/automerge_comment.py --repo "$REPO" --pr "$PR" \
            --headline "Automerge is waiting" --message "$MESSAGE" --run-url "$RUN_URL"

      - name: Ensure mergeable before squash
        if: steps.verify.outputs.green == 'true'
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5; do
            MERGEABLE=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q .mergeable)
            if [ "$MERGEABLE" = "MERGEABLE" ]; then
              exit 0
            fi
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              # Main moved after the conflict check above. The next run resolves
              # it; this one does not merge a head it has not gated.
              echo "::error::PR #$PR became CONFLICTING before the squash."
              exit 1
            fi
            sleep 5
          done
          echo "::error::PR #$PR still not mergeable ($MERGEABLE) after retries."
          exit 1

      - name: Squash merge and delete branch (pinned to the gated SHA)
        id: squash
        if: steps.verify.outputs.green == 'true'
        run: |
          set -euo pipefail
          # Re-read state right before the side effect: the twin run for this
          # head may have merged it while this job waited for the merge lock.
          STATE=$(gh pr view "$PR" --repo "$REPO" --json state -q .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR is $STATE; nothing to merge."
            exit 0
          fi
          # sha= makes GitHub refuse the merge if the head is no longer the one
          # the gate passed.
          if ! gh api --method PUT "repos/${REPO}/pulls/${PR}/merge" \
                 -f merge_method=squash -f sha="$GATED_SHA" > "$RUNNER_TEMP/merge.json" 2> "$RUNNER_TEMP/merge.err"; then
            cat "$RUNNER_TEMP/merge.err" >&2
            if grep -q "Head branch was modified" "$RUNNER_TEMP/merge.err"; then
              echo "PR #$PR head moved after the gate; not merging. Its own run gates the new head."
              exit 0
            fi
            exit 1
          fi
          cat "$RUNNER_TEMP/merge.json"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          gh api --method DELETE "repos/${REPO}/git/refs/heads/${HEAD_REF}" \
            || echo "Branch ${HEAD_REF} already deleted."

      - name: Summary
        if: steps.squash.outputs.merged == 'true'
        run: |
          echo "Merged PR #$PR ($HEAD_REF) at $GATED_SHA into main."

      - name: Advance any committee task merged by this PR
        if: steps.squash.outputs.merged == 'true'
        run: |
          gh api --method POST "repos/$REPO/dispatches" \
            -f event_type=advance-investment-committee

  notify:
    # A blocked automerge used to be silent — six green-looking PRs sat open
    # for days because their Research quality CI was red and nothing said so.
    # Post (or update) one marker comment on the PR whenever a lane gate or
    # the merge fails, so the blocking reason is visible on the PR itself.
    needs: [resolve-pr, gate, code-gate, merge]
    if: >-
      !cancelled() &&
      needs.resolve-pr.outputs.eligible == 'true' &&
      (needs.gate.result == 'failure' || needs.code-gate.result == 'failure' || needs.merge.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/automerge_comment.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comment the blocking reason on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.resolve-pr.outputs.number }}
          LANE: ${{ needs.resolve-pr.outputs.lane }}
          MERGE: ${{ needs.merge.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$MERGE" = "failure" ]; then
            REASON="the merge step failed (a check on the gated commit is red, a conflict with main, or the squash was rejected)"
          elif [ "$LANE" = "research" ]; then
            REASON="the research gate failed: provenance validation or the Research quality workflow is red"
          else
            REASON="one or more CI checks on the head commit failed or never completed"
          fi
          # automerge_comment.py skips a PR that is no longer open: the twin
          # run for this head may have merged it since this one failed.
          python _system/scripts/automerge_comment.py --repo "$REPO" --pr "$PR" \
            --message "${REASON}. Nothing merges while this stands; fix the cause and push, and automerge re-runs on every sync." \
            --run-url "$RUN_URL"
