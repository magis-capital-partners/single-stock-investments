name: Reverse-split financial coverage
on:
  workflow_dispatch:
  repository_dispatch:
    types: [reverse-split-financials-continue, reverse-split-financials-refresh]
  schedule:
    - cron: '11,41 * * * *'
permissions:
  contents: read
concurrency:
  group: reverse-split-financial-coverage
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 295
    outputs:
      continue: ${{ steps.harvest.outputs.continue }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dashboard/cloudflare/reverse-split-live
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded document readers
        run: |
          python -m pip install PyMuPDF==1.28.0
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-eng
      - name: Validate the installed financial document readers
        run: python -m unittest discover -s dashboard/cloudflare/reverse-split-live -p test_fundamental_filing.py
      - name: Backfill and warm primary financial evidence
        id: harvest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: node dashboard/cloudflare/reverse-split-live/financials-harvest.mjs --run-minutes 270 --max-documents 8 --max-issuers 5000
  continue:
    needs: harvest
    if: needs.harvest.result == 'success' && needs.harvest.outputs.continue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Continue the independent source search
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh api --method POST "repos/$REPOSITORY/dispatches" -f event_type=reverse-split-financials-continue
