name: Energy model tests

on:
  pull_request:
    paths:
      - '_system/scripts/*energy*'
      - '_system/scripts/power_cost_model.py'
      - '_system/scripts/fetch_crypto_panel.py'
      - '_system/scripts/build_hk_snowball_model.py'
      - '_system/scripts/tests/test_energy*'
      - 'dashboard/energy-model*'
      - 'dashboard/data/energy*'
      - 'dashboard/data/energy_exports/**'
      - 'dashboard/insights-viz.js'
      - 'dashboard/index.html'
      - '_system/reference/energy/**'
      - '_system/reference/market-data/energy/**'
      - '.github/workflows/energy-model-tests.yml'

permissions:
  contents: read

jobs:
  energy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/
            /_system/reference/energy/
            /_system/reference/market-data/energy/
            /_system/reference/market-data/crypto/
            /dashboard/energy-model-viz.js
            /dashboard/energy-model.css
            /dashboard/insights-viz.js
            /dashboard/data/energy_model.json
            /dashboard/data/energy_btc_bridge.json
            /dashboard/data/hk_snowball_model.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model invariants and BTC regressions
        run: |
          python -m unittest discover -s _system/scripts/tests -p test_energy_model.py -v
          python _system/scripts/test_btc_cost_of_production.py
          python _system/scripts/test_hk_snowball_model.py
          python _system/scripts/validate_energy_model.py
      - name: Optional UI and syntax
        run: |
          node --check dashboard/energy-model-viz.js
          node --check dashboard/insights-viz.js
          node _system/scripts/tests/test_energy_model_ui.cjs
