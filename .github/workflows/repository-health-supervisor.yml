name: Repository Health Supervisor

# Judges every declared lane from job-level, work-done receipts, re-runs what a
# retry can heal (backoff, at most three dispatches per lane per UTC day), opens
# one `lane-failure` issue per persistent failure fingerprint, and alerts Slack
# on a new failure issue, a stale or recovered lane, D1 usage past 60%/80% of
# the free daily limits, a gap in its own runs, plus one daily digest.
# See _system/scripts/supervise_repository_health.py.
#
# Every two hours at :41. The quarter-hours are where GitHub drops and delays
# scheduled runs here (this workflow's own `35 */4` ran 4 of 6 slots a day, and
# starts ran 2-5h late), so a nominal two-hour cadence is what keeps real gaps
# under the 8h the ops-watchdog Worker alerts on from outside GitHub.
on:
  schedule:
    - cron: "41 */2 * * *"
  # supervisor-run is the on-demand trigger (no workflow_dispatch: the
  # governance test bans manual run buttons outside its allowlist):
  #   gh api --method POST repos/:owner/:repo/dispatches -f event_type=supervisor-run
  repository_dispatch:
    types: [supervise-repository-health, supervisor-run]
permissions:
  actions: write
  checks: read
  contents: write
  issues: write

concurrency:
  group: repository-health-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/actions/commit-main
            _system/scripts
            _system/graph/graph_sources.json
            _system/data/lane_receipts
            _system/data/repository_health_supervisor.json
            dashboard/data/criticality_summary.json
            dashboard/data/technical_summary.json
            dashboard/data/market_risk_components.json
            dashboard/data/vol_metrics_latest.json
            dashboard/data/spx_surface_latest.json
            dashboard/data/insights/podcasts.json
            dashboard/data/warrants.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh job-level lane receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python _system/scripts/build_lane_receipts.py
      - name: Supervise lanes, heal, file issues, alert Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python _system/scripts/supervise_repository_health.py --act
      - name: Commit receipts and supervisor state
        uses: ./.github/actions/commit-main
        with:
          message: "chore(health): refresh workflow receipts and healer state"
          git_add: >-
            _system/data/lane_receipts
            _system/data/repository_health_supervisor.json
