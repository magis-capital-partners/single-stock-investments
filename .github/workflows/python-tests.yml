  # Bot pushes (GITHUB_TOKEN) start no workflow, so main is also tested daily.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: true

jobs:
  undefined-names:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/
            /_system/trading/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Undefined names and parse errors (ruff F821)
        # No allowance: main has no undefined names. A file ruff cannot parse
        # fails too, because a syntax error hides every F821 in that file.
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet "ruff==0.16.0"
          python _system/scripts/check_undefined_names.py _system/scripts _system/trading

  hub-payloads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESEARCH_VAULT_ROOT: _external/research-vault
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/check_hub_payloads.py
            /_system/scripts/private_dashboard_assets.py
            /_system/scripts/vault_paths.py
            /.github/actions/checkout-vault/
            /dashboard/private-assets.json
            /dashboard/data/core.json
            /dashboard/data/desk_briefs.json
            /dashboard/data/reverse_splits.json
            /dashboard/data/short_alpha.json
            /dashboard/data/special_situations.json
            /dashboard/data/separations.json
            /dashboard/data/buyback_radar.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore authorized private hub inputs
        uses: ./.github/actions/checkout-vault
        with:
          include-source-archive: "false"
      - name: Committed hub shards reconcile
        run: python _system/scripts/check_hub_payloads.py

  market-data-csvs:
    # The unit-test checkout leaves out the reference corpus, so the CSVs
    # themselves are checked here: Stooq's HTML bot check sat in
    # benchmarks/spy_us.csv for three months behind an HTTP 200.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /_system/scripts/check_market_data_csvs.py
            /_system/reference/market-data/**/*.csv
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No HTML saved as CSV under market-data
        run: python _system/scripts/check_market_data_csvs.py

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESEARCH_VAULT_ROOT: _external/research-vault
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      # Empty after the publisher cadence assertion was reconciled with main.
      KNOWN_FAILURES: ""
      # Suites that live beside the scripts rather than under tests/. Missing
      # files are skipped, so a list entry can land before its file does.
      EXTRA_TEST_FILES: >-
        _system/scripts/test_lane_registry.py
        _system/scripts/test_build_lane_receipts.py
        _system/scripts/test_supervisor_workflows.py
        _system/scripts/test_fetch_video_transcript.py
        _system/scripts/test_wait_for_workflow_run.py
        _system/scripts/test_check_media_analysis_freshness.py
        _system/scripts/test_build_dashboard_shards.py
        _system/scripts/test_special_situations.py
        _system/scripts/test_split_off_terms.py
        _system/scripts/test_separation_flow_impact.py
        _system/scripts/test_separation_wiring.py
        _system/scripts/test_separation_falsifier_adapter.py
        _system/scripts/test_epistemic_integrity.py
        _system/scripts/test_lint_deep_dive_separation.py
        _system/scripts/test_separations_ui.py
        _system/scripts/test_cvr_discovery.py
        _system/scripts/test_generalized_valuation_system.py
        _system/scripts/test_activist_attribution.py
        _system/scripts/test_activist_subject.py
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          # What the suites read: _system without the reference corpus (its
          # top-level registries stay), the workflows some tests parse, the D1
          # migrations, edge functions and oauth proxy, the ops-watchdog worker
          # config, one criticality summary, the L0 summary feeds and L1 agent
          # shards (the FTS5 ticker query is built from those shards), every
          # thesis card and latest.json (claim rebuild and the 10-ticker
          # golden eval), GOOGL/research/valuation.json (get_valuation), the
          # TPL/GOOGL canonical evidence files the architecture test opens,
          # one ticker download script for the payload-path test, and
          # SOURCES.md for the source-index contract.
          sparse-checkout: |
            /_system/
            !/_system/reference/*/
            /_system/reference/energy/
            /_system/reference/market-data/energy/
            /.github/
            /dashboard/cloudflare/
            /dashboard/functions/
            /dashboard/oauth-proxy/
            /dashboard/data/criticality_summary.json
            /dashboard/data/compounders.json
            /dashboard/data/commodity_models.json
            /dashboard/data/portfolio_summary.json
            /dashboard/data/research_manifest.json
            /dashboard/data/kpi_summary.json
            /dashboard/data/document_catalog_summary.json
            /dashboard/data/agent_shards/
            /dashboard/private-assets.json
            /*/research/thesis_card.json
            /*/research/latest.json
            /GOOGL/research/valuation.json
            /ops-watchdog/
            /AMZN/investor-documents/download_amzn_investor_docs.py
            /TPL/research/evidence/thematic_context.md
            /TPL/research/evidence/insider_signal.md
            /TPL/research/evidence/filing_digest.md
            /TPL/third-party-analyses/source_inventory.json
            /GOOGL/research/evidence/thematic_context.md
            /GOOGL/research/evidence/insider_signal.md
            /GOOGL/research/evidence/filing_digest.md
            /GOOGL/third-party-analyses/source_inventory.json
            /SOURCES.md
            /.gitignore
            /.gitattributes
            /CONTRIBUTING.md
            /docs/WRITE_MAP.md
            /dashboard/activist-viz.js
            /dashboard/criticality-viz.js
            /dashboard/darwin-cc-viz.js
            /dashboard/fund-letters/reader.js
            /dashboard/portfolio-viz.js
            /dashboard/reverse-split-strategy.js
            /dashboard/reverse-split-live.js
            /dashboard/reverse-split-research.js
            /dashboard/workspace-tools.js
            /dashboard/display-system.js
            /dashboard/display-system.css
            /dashboard/display-registry.json
            /dashboard/ui-format.js
            /dashboard/index.html
            /dashboard/company-research.js
            /dashboard/company-research.css
            /dashboard/compounders.js
            /dashboard/company-models.js
            /dashboard/commodity-model-viz.js
            /dashboard/research-desk.css
            /dashboard/research-workspace.js
            /dashboard/research-workspace.css
            /dashboard/valuation-viz.js
            /dashboard/insights-viz.js
            /dashboard/strategy-workbench.js
            /dashboard/strategy-workbench.css
            /dashboard/index-viz.js
            /dashboard/special-situations-viz.js
            /dashboard/separations-viz.js
            /dashboard/search-match.js
            /dashboard/buyback-viz.js
            /dashboard/buyback.css
            /dashboard/data/buyback_manifest.json
            /dashboard/data/buyback_snapshots/
            /dashboard/desk-briefs-viz.js
            /dashboard/overlap-viz.js
            /dashboard/short-alpha-viz.js
            /dashboard/reverse-splits-viz.js
            /dashboard/shorts-edge-v3-viz.js
            /dashboard/shorts-coverage-viz.js
            /dashboard/shorts-clean-data-viz.js
            /dashboard/shorts-fundamental-viz.js
            /dashboard/shorts-edge-v3.css
            /dashboard/ideas.css
            /dashboard/short-alpha.css
            /dashboard/data/separations.json
            /dashboard/data/special_situations.json
            /dashboard/data/desk_briefs.json
            /dashboard/data/short_alpha.json
            /dashboard/data/short_sleeve.json
            /dashboard/data/short_execution_audit.json
            /dashboard/data/short_adaptive_sizing.json
            /dashboard/data/technical_summary.json
            /dashboard/data/capitulation_daily.json
            /dashboard/data/index_membership.json
            /dashboard/data/portfolio_news.json
            /dashboard/data/warrants.json
            /dashboard/data/activist_feed.json
            /dashboard/data/nol_382_facts.json
            /dashboard/data/nol_screener.json
            /dashboard/data/document_catalog.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up the Node runtime for UI suites
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Show the UI test runtime
        run: node --version
      - name: Install test dependencies
        # Avoid the full trading requirements: these tests keep ib_async /
        # ib_insync absent, but the offline reverse-split replay imports these
        # research libraries directly.
        run: |
          python -m pip install --disable-pip-version-check --quiet \
            "pytest==9.1.1" "PyYAML==6.0.3" "jsonschema==4.26.0" "numpy==2.3.3" "scipy==1.16.2" \
            "ruff==0.16.0" "pandas==3.0.3" "requests==2.34.2" \
            "beautifulsoup4==4.15.0" "lxml==6.1.1" "exchange-calendars==4.13.2" "openpyxl==3.1.5" "pymupdf==1.28.0"
      - name: Restore authorized private architecture fixtures
        uses: ./.github/actions/checkout-vault
        with:
          include-source-archive: "false"
      - name: Trading and script test suites
        run: |
          set -euo pipefail
          DESELECT=()
          for test_id in $KNOWN_FAILURES; do DESELECT+=(--deselect "$test_id"); done
          EXTRA=()
          for test_file in $EXTRA_TEST_FILES; do
            if [ -f "$test_file" ]; then EXTRA+=("$test_file"); else echo "not present yet: $test_file"; fi
          done
          python -m pytest -q -p no:cacheprovider "${DESELECT[@]}" \
            _system/trading _system/scripts/tests "${EXTRA[@]}"
      - name: Known failures (reported, not gating)
        # One at a time: run together, one that still fails would hide one
        # that has started passing.
        run: |
          STILL=0
          for test_id in $KNOWN_FAILURES; do
            if python -m pytest -q -p no:cacheprovider "$test_id" > "$RUNNER_TEMP/known.txt" 2>&1; then
              echo "::warning title=Known failure now passes::${test_id} passes; remove it from KNOWN_FAILURES in python-tests.yml so it gates again."
            else
              STILL=$((STILL + 1))
              echo "still failing: ${test_id}"
              tail -n 5 "$RUNNER_TEMP/known.txt"
            fi
          done
          echo "${STILL} known failure(s) still fail; they stay deselected from the gate."
