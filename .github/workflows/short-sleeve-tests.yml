name: Short sleeve research
on:
  push:
    branches: [main]
    paths: ['dashboard/short-sleeve*', 'dashboard/data/short_sleeve.json', 'dashboard/data/short_execution_audit.json', 'dashboard/data/short_adaptive_sizing.json', '_system/scripts/short_sleeve_research.py', '_system/scripts/short_execution_audit.py', '_system/scripts/short_adaptive_sizing.py', '_system/scripts/tests/test_short_sleeve*', '_system/scripts/tests/test_short_execution_audit.py', '_system/scripts/tests/test_short_adaptive_sizing.py', '.github/workflows/short-sleeve-tests.yml']
  pull_request:
    paths: ['dashboard/short-sleeve*', 'dashboard/data/short_sleeve.json', 'dashboard/data/short_execution_audit.json', 'dashboard/data/short_adaptive_sizing.json', '_system/scripts/short_sleeve_research.py', '_system/scripts/short_execution_audit.py', '_system/scripts/short_adaptive_sizing.py', '_system/scripts/tests/test_short_sleeve*', '_system/scripts/tests/test_short_execution_audit.py', '_system/scripts/tests/test_short_adaptive_sizing.py', '.github/workflows/short-sleeve-tests.yml']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/short_sleeve_research.py
            _system/scripts/short_execution_audit.py
            _system/scripts/short_adaptive_sizing.py
            _system/scripts/tests/test_short_sleeve_research.py
            _system/scripts/tests/test_short_execution_audit.py
            _system/scripts/tests/test_short_adaptive_sizing.py
            _system/scripts/tests/test_short_sleeve_engine.cjs
            dashboard/short-sleeve-engine.js
            dashboard/short-sleeve-viz.js
            dashboard/short-sleeve-worker.js
            dashboard/data/short_sleeve.json
            dashboard/data/short_execution_audit.json
            dashboard/data/short_adaptive_sizing.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install pytest numpy
      - run: python -m pytest _system/scripts/tests/test_short_sleeve_research.py _system/scripts/tests/test_short_execution_audit.py _system/scripts/tests/test_short_adaptive_sizing.py -q
      - run: node --test _system/scripts/tests/test_short_sleeve_engine.cjs
      - run: node --check dashboard/short-sleeve-viz.js && node --check dashboard/short-sleeve-worker.js
