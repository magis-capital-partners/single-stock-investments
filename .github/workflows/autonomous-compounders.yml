name: Autonomous compounder IRRs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous-compounders.yml'
      - '*/research/valuation.json'
      - '_system/portfolio/registry.json'
      - '_system/reference/valuation_listing_ratios.json'
      - '_system/reference/valuation_identity_aliases.json'
      - '_system/reference/valuation_method_registry.json'
      - '_system/scripts/valuation_forecast.py'
      - '_system/scripts/automatic_forecast_model.py'
      - '_system/scripts/legacy_forecast_model.py'
      - '_system/scripts/refresh_shared_forecasts.py'
      - '_system/scripts/valuation_market_sync.py'
      - '_system/scripts/valuation_share_basis.py'
      - '_system/scripts/valuation_share_evidence.py'
  schedule:
    - cron: '23 8,18 * * 1-5'
      timezone: America/New_York
  repository_dispatch:
    types: [refresh-autonomous-compounders]

permissions:
  contents: write

concurrency:
  group: autonomous-compounder-irrs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_VAULT_ROOT: _external/research-vault
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /_system/scripts/
            /*/research/valuation.json
            /_system/reference/market-data/valuation_quotes/
            /_system/reference/market-data/valuation_fundamentals/
            /_system/data/shared_valuation_forecasts.json
            _system/portfolio/registry.json
            _system/reference/core_compounders.json
            _system/reference/valuation_listing_ratios.json
            _system/reference/valuation_identity_aliases.json
            _system/reference/valuation_method_registry.json
            _system/reference/market-data/compounders
            _system/reference/market-data/operating_kpis
            _system/data/autonomous_compounders.json
            dashboard/data/core.json
            dashboard/data/tickers
            dashboard/private-assets.json
            .gitattributes
            .github/actions/checkout-vault
            .github/actions/preserve-private-dashboard
            .github/actions/commit-main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser and regression dependencies
        run: pip install pytest pypdf exchange_calendars==4.13.2
      - name: Restore authorized private research inputs
        uses: ./.github/actions/checkout-vault
      - name: Verify automatic publication checks
        run: python -m pytest -q _system/scripts/tests/test_autonomous_compounders.py _system/scripts/tests/test_shared_valuation_forecast.py _system/scripts/tests/test_valuation_market_sync.py
      - name: Collect, validate and publish every core compounder
        run: python _system/scripts/autonomous_compounders.py --collect
      - name: Validate source-bound replay and complete universe
        run: python _system/scripts/autonomous_compounders.py --check
      - name: Refresh shared forecasts for the complete coverage universe
        run: python _system/scripts/refresh_shared_forecasts.py --collect
      - name: Verify every served PV and IRR against the same model
        run: python _system/scripts/refresh_shared_forecasts.py --check
      - name: Publish dated research estimates
        uses: ./.github/actions/commit-main
        with:
          message: 'chore(research): refresh autonomous compounder IRRs'
          git_add: >-
            _system/data/autonomous_compounders.json
            _system/data/shared_valuation_forecasts.json
            _system/reference/market-data/valuation_quotes
            _system/reference/market-data/valuation_fundamentals
            _system/reference/market-data/compounders
            _system/reference/market-data/operating_kpis
            dashboard/data/core.json dashboard/data/tickers
