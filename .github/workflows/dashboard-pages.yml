name: Deploy Dashboard (Cloudflare Pages)

on:
  # Recovery path after the 00:00 UTC D1 quota reset: retries D1 stages that a
  # deploy deferred, and guarantees one retention pass per UTC day. Cheap when
  # there is nothing to do: the deploy gate skips it unless the deploy inputs
  # changed, a D1 stage is owed, or today's retention has not run. An off-peak
  # minute, because top-of-hour crons queue for hours here (00:15 fired ~04:45).
  schedule:
    - cron: "37 1 * * *"
  push:
    branches: [main]
    paths:
      # Deploy-only / light rebuild when committed dashboard or deploy scripts change.
      # Heavy research/data rebuilds happen in Data Pipeline before workflow_run deploy.
      - "dashboard/**"
      - "_system/scripts/build_dashboard_data.py"
      - "_system/scripts/fetch_float_adv.py"
      - "_system/scripts/build_technical_signals.py"
      - "_system/scripts/build_cloudflare_pages_site.py"
      - "_system/scripts/export_dashboard_d1_seed.py"
      - "_system/scripts/export_sleeve_d1.py"
      - "_system/scripts/prune_cloudflare_d1.py"
      - "_system/scripts/validate_portfolio_private_boundary.py"
      - "_system/scripts/workflow_run_deploy_gate.py"
      - "_system/scripts/validate_dashboard_data.py"
      - "_system/scripts/ci_dashboard_deploy_mode.sh"
      - "_system/scripts/ci_rebuild_profile.py"
      - ".github/workflows/dashboard-pages.yml"
      - ".github/actions/publish-dashboard/**"
      - ".github/actions/rebuild-data/**"
      - ".github/actions/deploy-cloudflare-dashboard/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual dashboard deploy is needed"
        required: false
        default: "manual republish of committed dashboard/"
      d1_full_resync:
        description: "Re-emit every D1 seed row, ignoring the stored per-ticker hashes (repair only)"
        type: boolean
        required: false
        default: false
  workflow_run:
    workflows:
      - Data Pipeline
      - Forced Flow Daily
      - Power Zone Universe
      - LS-algo Universe Intake
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# No workflow-level concurrency. It used to cancel in-progress runs, which let
# a run that only reports an upstream failure cancel a deploy mid-flight --
# and, because `build` used always(), the "cancelled" deploy ran anyway.
# Deploys are serialized on the build job instead (see there).

jobs:
  # A failed upstream turns this run red so the failure is visible next to
  # the deploys. The deploy itself no longer depends on the upstream's result:
  # the gate below publishes whatever changed on main.
  upstream-failed:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Upstream '${{ github.event.workflow_run.name }}' concluded 'failure'. The dashboard deploys only what that run committed before failing, if anything." >&2
          exit 1

  # workflow_run and schedule deploy only when what a deploy publishes differs
  # from what the LAST fully synced deploy shipped (not "was ever shipped": a
  # revert must redeploy). 2026-09-18..24: 73 of 98 D1 syncs came from Power
  # Zone / LS-algo runs whose main job was skipped and which committed
  # nothing. See _system/scripts/workflow_run_deploy_gate.py.
  deploy-gate:
    if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build deploys the tip of main, so fingerprint the tip of main.
          ref: main
          sparse-checkout: |
            _system/scripts/workflow_run_deploy_gate.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          filter: blob:none
      - name: Fingerprint the deploy inputs on main
        id: fp
        run: python _system/scripts/workflow_run_deploy_gate.py fingerprint
      # The primary key never exists; the prefix match returns the most
      # recently created entry, i.e. the last fully synced deploy.
      - name: Restore the last fully synced deploy's fingerprint
        id: last
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-last
          key: dashboard-deploy-last-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dashboard-deploy-last-v1-
      # What the site shows can be newer than what D1 last synced (Pages
      # ships even when D1 is deferred), so it is tracked on its own.
      - name: Restore the last shipped deploy's fingerprint
        id: shipped
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-shipped
          key: dashboard-deploy-shipped-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dashboard-deploy-shipped-v1-
      - name: Look up a D1 deferral of these inputs today
        id: deferred
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-marker
          key: dashboard-deploy-deferred-v1-${{ steps.fp.outputs.hash }}-${{ steps.fp.outputs.utc_date }}
          lookup-only: true
      - name: Look up today's D1 retention
        id: pruned
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-marker
          key: dashboard-d1-pruned-v1-${{ steps.fp.outputs.utc_date }}
          lookup-only: true
      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FINGERPRINT: ${{ steps.fp.outputs.hash }}
          DEFERRED: ${{ steps.deferred.outputs.cache-hit }}
          PRUNED: ${{ steps.pruned.outputs.cache-hit }}
        run: |
          python _system/scripts/workflow_run_deploy_gate.py decide \
            --event "$EVENT" --fingerprint "$FINGERPRINT" --last-file .deploy-gate-last/fingerprint \
            --shipped-file .deploy-gate-shipped/fingerprint \
            --deferred-hit "$DEFERRED" --pruned-hit "$PRUNED"

  oauth-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required for dashboard deploy." >&2
            exit 1
          fi

  # Detect oauth-proxy path changes without cloning this monorepo.
  # Full checkout here previously hung/timed out and painted the whole deploy red
  # even when the Pages build job succeeded.
  oauth-changed:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fingerprint the oauth-proxy directory at each ref (no clone; avoids
          # compare-API 300-file truncation on large merges).
          fingerprint() {
            local ref="$1"
            gh api "repos/${REPO}/contents/dashboard/oauth-proxy?ref=${ref}" \
              --jq 'if type=="array" then sort_by(.path) | map(.path + ":" + .sha) | join("|") else (.path + ":" + .sha) end' \
              2>/dev/null || echo "ABSENT"
          }
          BEFORE_FP="$(fingerprint "$BEFORE")"
          AFTER_FP="$(fingerprint "$AFTER")"
          if [ "$BEFORE_FP" != "$AFTER_FP" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  oauth-proxy:
    needs: [oauth-secrets, oauth-changed]
    if: |
      !cancelled() &&
      needs.oauth-secrets.result == 'success' &&
      needs.oauth-secrets.outputs.configured == 'true' &&
      (
        (github.event_name == 'push' && needs.oauth-changed.outputs.changed == 'true')
      )
    concurrency:
      group: dashboard-oauth-proxy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Checkout workspace (minimal)
        run: bash _system/scripts/ci_checkout_workspace.sh minimal
      - name: Sparse checkout oauth proxy
        run: |
          git sparse-checkout add dashboard/oauth-proxy
          git read-tree -mu HEAD
      - uses: ./.github/actions/deploy-oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  build:
    needs: [oauth-secrets, oauth-proxy, deploy-gate]
    # !cancelled(), never always(): always() started this job even after the
    # run was cancelled or superseded, so "cancelled" runs still deployed and
    # still spent D1 rows (69 of 218 D1 syncs, 2026-09-10..24).
    if: |
      !cancelled() &&
      needs.oauth-secrets.result == 'success' &&
      (needs.oauth-proxy.result == 'success' || needs.oauth-proxy.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.deploy-gate.outputs.should_deploy == 'true'
      )
    # One deploy at a time, never killed mid-flight (a D1 import or Pages
    # upload cut in half helps nobody). A newer queued build replaces an older
    # queued one, which is cancelled and never deploys.
    concurrency:
      group: dashboard-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RESEARCH_VAULT_REPO_URL: ${{ secrets.RESEARCH_VAULT_REPO_URL }}
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
      RESEARCH_VAULT_ROOT: _external/research-vault
    environment:
      name: cloudflare-pages
      url: ${{ steps.cloudflare.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            _system/scripts/ci_checkout_workspace.sh
            _system/scripts/ci_resolve_checkout_ref.sh
            _system/scripts/ci_sparse_checkout_paths.py
            _system/scripts/ci_dashboard_deploy_mode.sh
          sparse-checkout-cone-mode: false
          fetch-depth: ${{ github.event_name == 'push' && 2 || 1 }}
      - name: Resolve deploy mode
        id: mode
        run: |
          bash _system/scripts/ci_dashboard_deploy_mode.sh
          echo "Deploy mode: $(cat "$GITHUB_OUTPUT")"
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        if: steps.mode.outputs.needs_disk_cleanup == 'true'
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          swap-storage: true
      - name: Checkout workspace (deploy mode)
        run: bash _system/scripts/ci_checkout_workspace.sh "${{ steps.mode.outputs.checkout_profile }}"
      # Re-check after queueing behind another deploy: when that deploy
      # already shipped exactly this content, there is nothing left to do.
      - name: Fingerprint what this job would deploy
        id: fingerprint
        run: python _system/scripts/workflow_run_deploy_gate.py fingerprint
      - name: Re-check the last fully synced deploy's fingerprint
        id: last
        if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-last
          key: dashboard-deploy-last-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dashboard-deploy-last-v1-
      - name: Re-check the last shipped deploy's fingerprint
        id: shipped
        if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-shipped
          key: dashboard-deploy-shipped-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dashboard-deploy-shipped-v1-
      - name: Re-check for a D1 deferral of these inputs today
        id: deferred
        if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-marker
          key: dashboard-deploy-deferred-v1-${{ steps.fingerprint.outputs.hash }}-${{ steps.fingerprint.outputs.utc_date }}
          lookup-only: true
      - name: Re-check today's D1 retention
        id: pruned
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .deploy-gate-marker
          key: dashboard-d1-pruned-v1-${{ steps.fingerprint.outputs.utc_date }}
          lookup-only: true
      - name: Decide whether this job still has work
        id: proceed
        env:
          EVENT: ${{ github.event_name }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
          DEFERRED: ${{ steps.deferred.outputs.cache-hit }}
          PRUNED: ${{ steps.pruned.outputs.cache-hit }}
        run: |
          python _system/scripts/workflow_run_deploy_gate.py decide \
            --event "$EVENT" --fingerprint "$FINGERPRINT" --last-file .deploy-gate-last/fingerprint \
            --shipped-file .deploy-gate-shipped/fingerprint \
            --deferred-hit "$DEFERRED" --pruned-hit "$PRUNED"
      - name: Rebuild and validate dashboard
        id: publish
        if: steps.proceed.outputs.should_deploy == 'true'
        uses: ./.github/actions/publish-dashboard
        with:
          skip_rebuild: ${{ steps.mode.outputs.skip_rebuild }}
          rebuild_profile: ${{ steps.mode.outputs.rebuild_profile }}
          validate: ${{ steps.mode.outputs.validate }}
          github_pages: "false"
        env:
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_PROXY_URL: ${{ vars.OAUTH_PROXY_URL }}
      - name: Deploy dashboard to Cloudflare Pages and D1
        id: cloudflare
        if: steps.proceed.outputs.should_deploy == 'true'
        uses: ./.github/actions/deploy-cloudflare-dashboard
        with:
          project-name: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'single-stock-investments' }}
          database-name: ${{ vars.CLOUDFLARE_D1_DATABASE || 'single-stock-investments' }}
          full-resync: ${{ github.event_name == 'workflow_dispatch' && inputs.d1_full_resync || false }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MARKET_RISK_INGEST_TOKEN: ${{ secrets.MARKET_RISK_INGEST_TOKEN }}
          SLEEVE_INGEST_TOKEN: ${{ secrets.SLEEVE_INGEST_TOKEN }}
          PORTFOLIO_INGEST_TOKEN: ${{ secrets.PORTFOLIO_INGEST_TOKEN }}
          CF_ACCESS_TEAM_DOMAIN: ${{ secrets.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
          PORTFOLIO_DREW_ACCESS_EMAILS: ${{ secrets.PORTFOLIO_DREW_ACCESS_EMAILS }}
          PORTFOLIO_MICHAEL_ACCESS_EMAILS: ${{ secrets.PORTFOLIO_MICHAEL_ACCESS_EMAILS }}
          IBKR_ACCOUNT_IDS_FOR_SCAN: ${{ secrets.IBKR_ACCOUNT_IDS_FOR_SCAN }}
      # Gate bookkeeping (Actions cache entries). The "last deployed" record is
      # written only when Pages shipped AND every D1 stage completed, so a
      # deferred stage keeps these inputs eligible for the post-reset retry.
      - name: Prepare gate markers
        if: steps.proceed.outputs.should_deploy == 'true'
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.hash }}
        run: |
          mkdir -p .deploy-gate-marker .deploy-gate-last .deploy-gate-shipped
          printf '%s' "$FINGERPRINT" > .deploy-gate-marker/fingerprint
          printf '%s' "$FINGERPRINT" > .deploy-gate-last/fingerprint
          printf '%s' "$FINGERPRINT" > .deploy-gate-shipped/fingerprint
      # Reached only when the deploy action succeeded, i.e. Pages shipped --
      # with or without deferred D1 work.
      - name: Record these inputs as the last shipped deploy
        if: steps.proceed.outputs.should_deploy == 'true'
        uses: actions/cache/save@v4
        with:
          path: .deploy-gate-shipped
          key: dashboard-deploy-shipped-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record these inputs as the last fully synced deploy
        if: steps.proceed.outputs.should_deploy == 'true' && steps.cloudflare.outputs.d1_deferred != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deploy-gate-last
          key: dashboard-deploy-last-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Mark today's D1 retention done
        if: steps.proceed.outputs.should_deploy == 'true' && steps.cloudflare.outputs.d1_pruned_today == 'true'
        uses: actions/cache/save@v4
        with:
          path: .deploy-gate-marker
          key: dashboard-d1-pruned-v1-${{ steps.cloudflare.outputs.d1_utc_date }}
      - name: Mark today's D1 deferral for these inputs
        if: steps.proceed.outputs.should_deploy == 'true' && steps.cloudflare.outputs.d1_deferred == 'true'
        uses: actions/cache/save@v4
        with:
          path: .deploy-gate-marker
          key: dashboard-deploy-deferred-v1-${{ steps.fingerprint.outputs.hash }}-${{ steps.cloudflare.outputs.d1_utc_date }}
      # Last, after Pages shipped: a deferred D1 stage used to be a ::warning::
      # on a green run. It is a failure now, and Slack hears about it.
      - name: Fail visibly when D1 work was deferred
        if: steps.proceed.outputs.should_deploy == 'true' && steps.cloudflare.outputs.d1_deferred == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STAGES: ${{ steps.cloudflare.outputs.d1_deferred_stages }}
          REASON: ${{ steps.cloudflare.outputs.d1_deferred_reason }}
          UTC_DATE: ${{ steps.cloudflare.outputs.d1_utc_date }}
          ROWS_READ: ${{ steps.cloudflare.outputs.d1_rows_read }}
          ROWS_WRITTEN: ${{ steps.cloudflare.outputs.d1_rows_written }}
        run: |
          python .github/actions/deploy-cloudflare-dashboard/d1_alert.py \
            --stages "$STAGES" --reason "$REASON" --utc-date "$UTC_DATE" \
            --rows-read "$ROWS_READ" --rows-written "$ROWS_WRITTEN"
          echo "::error::The static site deployed, but D1 stage(s) were deferred: ${STAGES}. ${REASON}. The first deploy after 00:00 UTC retries them."
          exit 1
