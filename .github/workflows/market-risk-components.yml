name: Market Risk Components

on:
  repository_dispatch:
    types: [heal-market-risk, market-risk-source-ready]
  workflow_run:
    workflows: [Market Close]
    types: [completed]
    branches: [main]
  # Once daily after the US close, down from twice-hourly across a ten-hour
  # window (20 runs a weekday). Every run writes a fresh row per component
  # into D1, and nothing reads market-risk components intraday -- this is a
  # research and allocation surface, not an execution screen -- so the extra
  # 19 runs bought no freshness anyone consumed while growing the table that
  # every read has to scan.
  #
  # This existing schedule is explicitly UTC: 22:19 UTC is 18:19 ET under EDT
  # and 17:19 ET under EST. GitHub now supports an IANA timezone field; a
  # proposed staged close refresh is documented in
  # docs/dashboard-cleanup-and-market-risk-plan.md. Changing the cron alone
  # would not bypass the volatility builder's 18:00 ET completion gate.
  schedule:
    - cron: "19 22 * * 1-5"  # moved off the quarter-hour, where GitHub drops and delays scheduled runs
permissions:
  contents: write

concurrency:
  group: market-risk-components
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    env:
      MARKET_RISK_INGEST_URL: https://single-stock-market-risk-ingest.magis-capital.workers.dev/api/v1/market-risk/ingest
      MARKET_RISK_INGEST_TOKEN: ${{ secrets.MARKET_RISK_INGEST_TOKEN }}

    steps:
      - name: Fetch dashboard inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/ssi-source"
          git clone --depth 1 --filter=blob:none --no-checkout \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$source_root"
          git -C "$source_root" sparse-checkout init --no-cone
          git -C "$source_root" sparse-checkout set \
            _system/scripts/build_market_risk_components.py \
            _system/scripts/market_sessions.py \
            _system/scripts/market_risk_publication.py \
            _system/scripts/buyback_calendar.py \
            dashboard/data/technical_summary.json \
            dashboard/data/spx_surface_latest.json \
            dashboard/data/vol_metrics_latest.json
          git -C "$source_root" checkout --detach "$GITHUB_SHA"
          mkdir -p _system/scripts dashboard/data
          cp "$source_root/_system/scripts/build_market_risk_components.py" \
            _system/scripts/build_market_risk_components.py
          for script in market_sessions market_risk_publication buyback_calendar; do
            cp "$source_root/_system/scripts/$script.py" "_system/scripts/$script.py"
          done
          for name in technical_summary spx_surface_latest vol_metrics_latest; do
            cp "$source_root/dashboard/data/$name.json" "dashboard/data/$name.json"
          done

      - name: Check out ETF Dashboard data
        uses: actions/checkout@v5
        with:
          repository: GoldmanDrew/etf-dashboard
          path: _external/etf-dashboard
          fetch-depth: 1
          sparse-checkout: data
          sparse-checkout-cone-mode: true

      - name: Check out ls-algo data
        uses: actions/checkout@v5
        with:
          repository: GoldmanDrew/ls-algo
          path: _external/ls-algo
          token: ${{ secrets.LS_ALGO_TOKEN }}
          fetch-depth: 1
          sparse-checkout: data/etf_screened_today.csv
          sparse-checkout-cone-mode: false

      # The spx-0dte checkout that used to sit here is deliberately gone. It
      # 404'd on a token that no longer resolves to that repository, and the
      # SPX marks the risk stack needs are already committed in this repo by
      # build_spx_surface.py (CBOE delayed chain) and build_vol_metrics.py
      # (^VIX complex). Nothing here reaches into the trading repository.

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate source snapshots
        shell: bash
        run: |
          set -euo pipefail
          test -f _external/etf-dashboard/data/letf_rebalance_flows_latest.json
          test -f _external/ls-algo/data/etf_screened_today.csv
          test -f dashboard/data/technical_summary.json
          test -f dashboard/data/spx_surface_latest.json
          test -f dashboard/data/vol_metrics_latest.json

      - name: Build component snapshot
        run: |
          python _system/scripts/build_market_risk_components.py \
            --etf-root "$GITHUB_WORKSPACE/_external/etf-dashboard" \
            --ls-root "$GITHUB_WORKSPACE/_external/ls-algo" \
            --ssi-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/market-risk-components.json"

      - name: Verify published snapshot artifact
        run: |
          python - "$RUNNER_TEMP/market-risk-components.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          components = payload.get("components", [])
          coverage = payload.get("coverage", {})
          assert len(components) >= 10, f"unexpected component count: {len(components)}"
          assert coverage.get("total") == len(components)
          assert payload.get("generated_at")
          print(json.dumps({"components": len(components), "coverage": coverage}, sort_keys=True))
          PY

      - name: Commit changed dashboard fallback snapshot
        # Allow newer observations and improved verification later the same day.
        # Identical source state is idempotent; generated_at alone cannot deploy.
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/ssi-source"
          # Widen the sparse clone to the push helper, the files it always
          # runs (the fund-letter audit and its manifest, plus the dated-artifact
          # guard), and the committed fallback. Then move off the detached SHA
          # onto main so the helper can rebase and push. ci_push_main.sh also
          # materializes PUSH_DEPENDENCY_PATHS itself, so a later dependency
          # does not depend on this list staying complete.
          git -C "$source_root" sparse-checkout add \
            _system/scripts/ci_push_main.sh \
            _system/scripts/audit_fund_letter_exposure.py \
            _system/scripts/compact_dated_artifacts.py \
            _system/scripts/atomic_io.py \
            dashboard/private-assets.json \
            dashboard/data/market_risk_components.json
          git -C "$source_root" fetch --depth 1 origin main
          git -C "$source_root" checkout -B main origin/main
          decision=$(python _system/scripts/market_risk_publication.py \
            "$source_root/dashboard/data/market_risk_components.json" \
            "$RUNNER_TEMP/market-risk-components.json")
          if [ "$decision" = "commit" ]; then
            cp "$RUNNER_TEMP/market-risk-components.json" \
              "$source_root/dashboard/data/market_risk_components.json"
            cd "$source_root"
            git add dashboard/data/market_risk_components.json
            bash _system/scripts/ci_push_main.sh \
              "chore(risk): daily market-risk components dashboard fallback"
          else
            echo "Source observations and verification state are unchanged; skipping duplicate publication."
          fi

      - id: publish
        name: Publish signed component snapshot
        # D1 is the preferred live path, but the committed snapshot above is
        # the dashboard's durable fallback and P6 freshness source. A transient
        # ingest 5xx must not prevent that independently valid artifact from
        # landing or make the lane look stale for days.
        continue-on-error: true
        run: |
          python _system/scripts/build_market_risk_components.py \
            --output "$RUNNER_TEMP/market-risk-components.json" \
            --publish-only

      - name: Report degraded live publish
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning::Live market-risk ingest failed; the validated committed fallback was refreshed."
