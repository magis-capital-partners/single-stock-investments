name: Underwriting contract validation
run-name: ${{ github.event.client_payload.sha && format('research-quality-pr {0} {1}', github.event.client_payload.pr, github.event.client_payload.sha) || github.workflow }}

on:
  pull_request:
    branches: [main]
    paths:
      - '*/research/valuation.json'
      - '*/research/underwriting_*.json'
  repository_dispatch:
    types: [underwriting-validate-pr]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_VAULT_ROOT: _external/research-vault
      RESEARCH_VAULT_CLONE_TOKEN: ${{ secrets.RESEARCH_VAULT_CLONE_TOKEN }}
    steps:
      - name: Bind the check to the exact open PR revision
        id: target
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.client_payload.pr }}
          REQUESTED_SHA: ${{ github.event.client_payload.sha }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']; number=int(os.environ['PR_NUMBER'])
          p=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/pulls/{number}']))
          assert p['state']=='open' and p['base']['ref']=='main' and p['head']['repo']['full_name']==repo
          sha=p['head']['sha']
          assert not os.environ.get('REQUESTED_SHA') or os.environ['REQUESTED_SHA']==sha
          check=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/check-runs','--method','POST','--input','-'],
              input=json.dumps({'name':'Underwriting contract validation','head_sha':sha,'status':'in_progress'}).encode()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"sha={sha}\ncheck_id={check['id']}\n")
          PY
      - name: Read trusted validators from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            _system/scripts
            .github/actions/checkout-vault
      - name: Read candidate data without executing candidate code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          path: candidate
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*/research/valuation.json
            /*/research/underwriting_*.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore immutable underwriting packets
        uses: ./.github/actions/checkout-vault
      - name: Recompile every reviewed candidate from its exact frozen evidence
        run: python _system/scripts/underwriting_pipeline.py validate --root candidate
      - name: Complete the immutable-head check
        if: always() && steps.target.outputs.check_id != ''
        env:
          CHECK_ID: ${{ steps.target.outputs.check_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          payload={'status':'completed','conclusion':'success' if os.environ['JOB_STATUS']=='success' else 'failure'}
          subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs/{os.environ['CHECK_ID']}",
              '--method','PATCH','--input','-'],input=json.dumps(payload).encode(),check=True,stdout=subprocess.DEVNULL)
          PY
