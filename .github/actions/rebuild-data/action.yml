name: Rebuild dashboard data
description: Run build_dashboard_data pipeline by profile (same job, shared workspace)

inputs:
  profile:
    description: full|intake-full|activist|insights|pages-fast|minimal|none
    required: true
  validate:
    description: Run validate_dashboard_data.py
    required: false
    default: "false"

outputs:
  failed_source:
    description: Script that failed. Empty when the profile step itself succeeded.
    value: ${{ steps.profile.outputs.failed_source }}
  dashboard_written:
    description: true once dashboard assembly has started. Do not commit a failed rebuild after this.
    value: ${{ steps.profile.outputs.dashboard_written }}

runs:
  using: composite
  steps:
    - name: Checkout research vault (when configured)
      if: env.RESEARCH_VAULT_CLONE_TOKEN != '' && inputs.profile != 'none'
      uses: ./.github/actions/checkout-vault

    - name: Install rebuild dependencies
      # Full profiles run the Power Zone decision pipeline, which needs numpy.
      if: >
        inputs.profile == 'full' ||
        inputs.profile == 'intake-full'
      shell: bash
      run: pip install -r _system/scripts/requirements-rebuild.txt

    - name: Install base dependencies
      if: >
        inputs.profile == 'intake-full' ||
        inputs.profile == 'full' ||
        inputs.profile == 'activist' ||
        inputs.profile == 'pages-fast' ||
        inputs.profile == 'insights' ||
        inputs.profile == 'minimal'
      shell: bash
      run: pip install -r _system/scripts/requirements.txt

    - name: Install optional energy workbook reader
      if: inputs.profile == 'world-model-weekly'
      shell: bash
      run: |
        if ! pip install -r _system/scripts/requirements-energy.txt; then
          echo "::warning::Energy workbook reader unavailable; cached project data will be retained."
        fi

    - name: Configure Google credentials
      if: >
        inputs.profile == 'intake-full' ||
        inputs.profile == 'full'
      shell: bash
      env:
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ env.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      run: |
        if [ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
          echo "::warning::GOOGLE_APPLICATION_CREDENTIALS_JSON not set; Drive audit/sync steps will be skipped."
          exit 0
        fi
        printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-service-account.json"
        echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-service-account.json" >> "$GITHUB_ENV"

    - name: Rebuild profile
      id: profile
      if: inputs.profile != 'none'
      shell: bash
      env:
        OAUTH_CLIENT_ID: ${{ env.OAUTH_CLIENT_ID }}
        OAUTH_PROXY_URL: ${{ env.OAUTH_PROXY_URL }}
      run: python _system/scripts/ci_rebuild_profile.py "${{ inputs.profile }}"

    - name: Validate dashboard JSON
      if: inputs.validate == 'true'
      shell: bash
      run: |
        python -m unittest _system/scripts/test_event_materiality.py _system/scripts/test_event_triage.py _system/scripts/test_validate_dashboard_sparse.py
        python _system/scripts/validate_dashboard_data.py
