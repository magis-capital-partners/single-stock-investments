name: Checkout research vault
description: Clone private magis-capital-partners/research-vault into RESEARCH_VAULT_ROOT

inputs:
  vault_ref:
    description: Git ref for vault repo (default main)
    required: false
    default: main
  hydrate:
    description: Copy private objects over public placeholders. false leaves the public files in place so a later commit cannot publish private bytes.
    required: false
    default: "true"
  include-source-archive:
    description: Include the complete extraction archive. Test fixtures can omit it while retaining all originals and dashboard snapshots.
    required: false
    default: "true"
  include-investor-history:
    description: Include the immutable investor holdings checkpoint for refresh or deployment.
    required: false
    default: "false"
  publication-only:
    description: Checkout only the private snapshot objects named by dashboard/private-assets.json, plus the migration journal and manifest. Omits letters, transcripts, investor history, the company-research cache, and the extraction archive.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate vault clone token
      shell: bash
      run: |
        if [ -z "${{ env.RESEARCH_VAULT_CLONE_TOKEN }}" ]; then
          echo "::error::RESEARCH_VAULT_CLONE_TOKEN is required."
          echo "::error::Public single-stock-investments cannot use GITHUB_TOKEN to read private research-vault."
          echo "::error::Add a fine-grained PAT with Contents: Read and write on magis-capital-partners/research-vault."
          exit 1
        fi

    - name: Clone research vault
      uses: actions/checkout@v4
      with:
        repository: magis-capital-partners/research-vault
        ref: ${{ inputs.vault_ref }}
        path: _external/research-vault
        token: ${{ env.RESEARCH_VAULT_CLONE_TOKEN }}
        fetch-depth: 1
        filter: ${{ (inputs.publication-only == 'true' || inputs.include-source-archive == 'false' || inputs.include-investor-history != 'true') && 'blob:none' || '' }}
        sparse-checkout: |
          ${{ inputs.publication-only == 'true' && '/dashboard-private/migration-journal.jsonl' || '' }}
          ${{ inputs.publication-only == 'true' && '/dashboard-private/manifest.json' || '' }}
          ${{ inputs.publication-only == 'true' && '/dashboard-private/.gitattributes' || '' }}
          ${{ inputs.publication-only != 'true' && (inputs.include-source-archive == 'false' || inputs.include-investor-history != 'true') && '/*' || '' }}
          ${{ inputs.publication-only != 'true' && inputs.include-source-archive == 'false' && '!/dashboard-private/company-source-backfill-v2/' || '' }}
          ${{ inputs.publication-only != 'true' && inputs.include-investor-history != 'true' && '!/dashboard-private/investor-history/' || '' }}
        sparse-checkout-cone-mode: false

    - name: Materialize publication objects
      if: inputs.publication-only == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f dashboard/private-assets.json ]; then
          echo "::error::publication-only checkout needs dashboard/private-assets.json in the workspace."
          exit 1
        fi
        python3 _system/scripts/vault_publication_sparse.py dashboard/private-assets.json > "$RUNNER_TEMP/vault-object-patterns.txt"
        if [ -s "$RUNNER_TEMP/vault-object-patterns.txt" ]; then
          git -C _external/research-vault sparse-checkout add --skip-checks --stdin < "$RUNNER_TEMP/vault-object-patterns.txt"
        fi
        python3 - <<'PY'
        import json
        import sys
        from pathlib import Path

        manifest = json.loads(Path("dashboard/private-assets.json").read_text(encoding="utf-8"))
        objects = Path("_external/research-vault/dashboard-private/objects")
        missing = 0
        total = 0
        for section in ("assets", "repository_assets"):
            for relative, entry in (manifest.get(section) or {}).items():
                total += 1
                if not (objects / entry["private_sha256"]).is_file():
                    missing += 1
                    print(f"::error::missing private object for {relative}")
        print(f"publication objects present: {total - missing} of {total}")
        if missing:
            sys.exit(1)
        PY
        echo "VAULT_PUBLICATION_ONLY=true" >> "$GITHUB_ENV"

    - name: Export RESEARCH_VAULT_ROOT
      shell: bash
      run: |
        root="${RESEARCH_VAULT_ROOT:-_external/research-vault}"
        echo "RESEARCH_VAULT_ROOT=$root" >> "$GITHUB_ENV"
        python3 - <<'PY' || true
        import json, os, sys
        sys.path.insert(0, "_system/scripts")
        os.environ["RESEARCH_VAULT_ROOT"] = os.environ.get("RESEARCH_VAULT_ROOT", "_external/research-vault")
        from vault_paths import vault_status
        status = vault_status()
        print(json.dumps(status, indent=2))
        if not status.get("letters_exists") and os.environ.get("VAULT_PUBLICATION_ONLY") != "true":
            print("::warning::superinvestor-letters missing in cloned research-vault")
        PY

    - name: Restore selected private inputs for authorized processing
      if: inputs.hydrate != 'false'
      shell: bash
      run: |
        if [ -f _system/scripts/private_dashboard_assets.py ] && [ -f dashboard/private-assets.json ]; then
          python _system/scripts/private_dashboard_assets.py
        fi
