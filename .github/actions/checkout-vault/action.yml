name: Checkout research vault
description: Clone private magis-capital-partners/research-vault into RESEARCH_VAULT_ROOT

inputs:
  vault_ref:
    description: Git ref for vault repo (default main)
    required: false
    default: main
  hydrate:
    description: Copy private objects over public placeholders. false leaves the public files in place so a later commit cannot publish private bytes.
    required: false
    default: "true"
  include-source-archive:
    description: Include every part of the current extraction archive. Historical unreferenced parts stay in Git. Test fixtures can omit the archive while retaining originals and dashboard snapshots.
    required: false
    default: "true"
  include-investor-history:
    description: Include the immutable investor holdings checkpoint for refresh or deployment.
    required: false
    default: "false"
  publication-only:
    description: Checkout only the private snapshot objects named by dashboard/private-assets.json, plus the migration journal and manifest. Omits letters, transcripts, investor history, the company-research cache, and the extraction archive.
    required: false
    default: "false"
  snapshot-validation-only:
    description: Read-only validation of complete snapshot files selected in this workspace. Requires publication-only.
    required: false
    default: "false"
  extra-paths:
    description: Additional non-cone sparse-checkout patterns, one per line. Applied after publication-only materialization. Use with publication-only so the rest of the vault stays out.
    required: false
    default: ""
  source-archive-current:
    description: Include current source archive parts in a publication-only checkout. Full vault readers already select the current manifest by default; historical parts stay in Git.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate vault clone token
      shell: bash
      run: |
        if [ -z "${{ env.RESEARCH_VAULT_CLONE_TOKEN }}" ]; then
          echo "::error::RESEARCH_VAULT_CLONE_TOKEN is required."
          echo "::error::Public single-stock-investments cannot use GITHUB_TOKEN to read private research-vault."
          echo "::error::Add a fine-grained PAT with Contents: Read and write on magis-capital-partners/research-vault."
          exit 1
        fi

    - name: Clone research vault
      uses: actions/checkout@v4
      with:
        repository: magis-capital-partners/research-vault
        ref: ${{ inputs.vault_ref }}
        path: _external/research-vault
        token: ${{ env.RESEARCH_VAULT_CLONE_TOKEN }}
        fetch-depth: 1
        filter: blob:none
        sparse-checkout: |
          ${{ inputs.publication-only == 'true' && '/dashboard-private/migration-journal.jsonl' || '' }}
          ${{ inputs.publication-only == 'true' && '/dashboard-private/manifest.json' || '' }}
          ${{ inputs.publication-only == 'true' && '/dashboard-private/.gitattributes' || '' }}
          ${{ inputs.publication-only != 'true' && '/*' || '' }}
          !/dashboard-private/objects/
          ${{ inputs.publication-only != 'true' && inputs.include-source-archive != 'true' && inputs.source-archive-current != 'true' && '!/dashboard-private/company-source-backfill-v2/' || '' }}
          ${{ inputs.publication-only != 'true' && (inputs.include-source-archive == 'true' || inputs.source-archive-current == 'true') && '!/dashboard-private/company-source-backfill-v2/*' || '' }}
          ${{ inputs.publication-only != 'true' && inputs.include-investor-history != 'true' && '!/dashboard-private/investor-history/' || '' }}
        sparse-checkout-cone-mode: false

    - name: Materialize the verified private catalog view
      shell: bash
      env:
        SNAPSHOT_VALIDATION_ONLY: ${{ inputs.snapshot-validation-only }}
        PUBLICATION_ONLY: ${{ inputs.publication-only }}
      run: |
        set -euo pipefail
        git sparse-checkout add --skip-checks -- /_system/config/private_storage.json /_system/scripts/private_storage.py /_system/scripts/private_storage_io.py /_system/scripts/private_storage_s3.py /dashboard/private-assets.json
        if python _system/scripts/private_storage_io.py enabled; then
          args=()
          if [ "$SNAPSHOT_VALIDATION_ONLY" = "true" ]; then
            test "$PUBLICATION_ONLY" = "true"
            args+=(--snapshot-validation-only)
          fi
          python _system/scripts/private_storage_io.py initialize --vault _external/research-vault "${args[@]}"
        fi

    - name: Materialize publication objects
      shell: bash
      env:
        SNAPSHOT_VALIDATION_ONLY: ${{ inputs.snapshot-validation-only }}
      run: |
        set -euo pipefail
        if [ ! -f dashboard/private-assets.json ]; then
          echo "::error::publication-only checkout needs dashboard/private-assets.json in the workspace."
          exit 1
        fi
        # Hydration already reads only files selected in this workspace.
        # Restore those same complete inputs, instead of unrelated snapshots.
        scope=(--workspace "$GITHUB_WORKSPACE")
        python3 _system/scripts/vault_publication_sparse.py dashboard/private-assets.json "${scope[@]}" > "$RUNNER_TEMP/vault-object-patterns.txt"
        if [ -s "$RUNNER_TEMP/vault-object-patterns.txt" ]; then
          git -C _external/research-vault sparse-checkout add --skip-checks --stdin < "$RUNNER_TEMP/vault-object-patterns.txt"
        fi
        python3 - <<'PY'
        import json
        import sys
        from pathlib import Path
        sys.path.insert(0, "_system/scripts")
        import os
        from private_storage_io import materialize
        from vault_publication_sparse import publication_entries

        manifest = json.loads(Path("dashboard/private-assets.json").read_text(encoding="utf-8"))
        objects = Path("_external/research-vault/dashboard-private/objects")
        missing = 0
        total = 0
        workspace = Path(os.environ["GITHUB_WORKSPACE"])
        for _, relative, entry in publication_entries(manifest, workspace):
            total += 1
            if not (objects / entry["private_sha256"]).is_file():
                materialize(Path("_external/research-vault"), "dashboard-private/objects/" + entry["private_sha256"])
            if not (objects / entry["private_sha256"]).is_file():
                missing += 1
                print(f"::error::missing private object for {relative}")
        print(f"publication objects present: {total - missing} of {total}")
        if missing:
            sys.exit(1)
        PY
        if [ "${{ inputs.publication-only }}" = "true" ]; then echo "VAULT_PUBLICATION_ONLY=true" >> "$GITHUB_ENV"; fi

    - name: Add extra vault paths
      if: inputs.extra-paths != ''
      shell: bash
      env:
        VAULT_EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        set -euo pipefail
        printf '%s\n' "$VAULT_EXTRA_PATHS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/vault-extra-paths.txt"
        if [ -s "$RUNNER_TEMP/vault-extra-paths.txt" ]; then
          git -C _external/research-vault sparse-checkout add --skip-checks --stdin < "$RUNNER_TEMP/vault-extra-paths.txt"
        fi

    - name: Materialize current source archive parts
      if: inputs.source-archive-current == 'true' || (inputs.publication-only != 'true' && inputs.include-source-archive == 'true')
      shell: bash
      env:
        EXPLICIT_ARCHIVE: ${{ inputs.source-archive-current }}
      run: |
        set -euo pipefail
        git -C _external/research-vault sparse-checkout add --skip-checks -- /dashboard-private/company-source-backfill-v2/manifest.json
        if [ ! -f _external/research-vault/dashboard-private/company-source-backfill-v2/manifest.json ]; then
          if [ "$EXPLICIT_ARCHIVE" = "true" ]; then
            echo "::error::The explicitly requested source archive manifest is missing."
            exit 1
          fi
          echo "No private source archive has been preserved yet."
          exit 0
        fi
        if [ ! -f _system/scripts/vault_source_archive_sparse.py ]; then
          git sparse-checkout add --skip-checks -- /_system/scripts/vault_source_archive_sparse.py
        fi
        python3 _system/scripts/vault_source_archive_sparse.py \
          _external/research-vault/dashboard-private/company-source-backfill-v2/manifest.json \
          > "$RUNNER_TEMP/vault-source-part-patterns.txt"
        if [ -s "$RUNNER_TEMP/vault-source-part-patterns.txt" ]; then
          git -C _external/research-vault sparse-checkout add --skip-checks --stdin < "$RUNNER_TEMP/vault-source-part-patterns.txt"
        fi

    - name: Restore requested immutable source parts from private storage
      if: inputs.source-archive-current == 'true' || (inputs.publication-only != 'true' && inputs.include-source-archive == 'true')
      shell: bash
      run: |
        python3 - <<'PY'
        import json, sys
        from pathlib import Path
        sys.path.insert(0, '_system/scripts')
        from private_storage_io import materialize
        vault=Path('_external/research-vault')
        manifest=vault/'dashboard-private/company-source-backfill-v2/manifest.json'
        if manifest.is_file():
            for part in json.loads(manifest.read_text()).get('parts', []):
                materialize(vault, 'dashboard-private/company-source-backfill-v2/'+part['file'])
        PY

    - name: Export RESEARCH_VAULT_ROOT
      shell: bash
      run: |
        root="${RESEARCH_VAULT_ROOT:-_external/research-vault}"
        echo "RESEARCH_VAULT_ROOT=$root" >> "$GITHUB_ENV"
        python3 - <<'PY' || true
        import json, os, sys
        sys.path.insert(0, "_system/scripts")
        os.environ["RESEARCH_VAULT_ROOT"] = os.environ.get("RESEARCH_VAULT_ROOT", "_external/research-vault")
        from vault_paths import vault_status
        status = vault_status()
        print(json.dumps(status, indent=2))
        if not status.get("letters_exists") and os.environ.get("VAULT_PUBLICATION_ONLY") != "true":
            print("::warning::superinvestor-letters missing in cloned research-vault")
        PY

    - name: Restore selected private inputs for authorized processing
      if: inputs.hydrate != 'false'
      shell: bash
      run: |
        if [ -f _system/scripts/private_dashboard_assets.py ] && [ -f dashboard/private-assets.json ]; then
          python _system/scripts/private_dashboard_assets.py
        fi
