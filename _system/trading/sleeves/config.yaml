ibkr:
  host: 127.0.0.1
  live_port: 7496
  paper_port: 7497
  # Required at runtime through IBKR_ACCOUNT or IBKR_ACCOUNT_ID.
  account_id: null
  # Do not reuse 0, 17 (SPX), 41 (ls-algo), 87, 90, or ls-algo worker offsets.
  client_ids:
    drew: 71
    michael: 72
    sync: 73

execution:
  dry_run: true
  allow_live: false
  quote_max_age_seconds: 15
  price_band_pct: 0.01
  cooldown_minutes: 10
  limit_orders_only: true
  allowed_sec_types: [STK, OPT]
  allowed_currencies: [USD, CAD]
  allowed_exchanges: [SMART, NYSE, NASDAQ, AMEX, ARCA, TSE]
  option_price_band_pct: 0.10

operators:
  drew:
    display_name: Drew
    order_ref: DREW_SLEEVE
    equity_usd: 100000
    extra_margin_usd: 100000
    max_notional_per_order: 25000
    max_name_pct_of_equity: 0.20
    max_open_names: 12
    corr_lookback_days: 252
  michael:
    display_name: Michael
    order_ref: MICHAEL_SLEEVE
    equity_usd: null
    extra_margin_usd: 0
    max_notional_per_order: 250000
    max_name_pct_of_equity: 0.25
    max_open_names: 80
    corr_lookback_days: 252

ingest:
  url: "https://single-stock-investments-2wt.pages.dev/api/v1/sleeves/ingest"
  token_env: SLEEVE_INGEST_TOKEN
  header_prefix: x-sleeve

desk:
  host: 127.0.0.1
  port: 8788

paths:
  kill_file: KILL
  logs_dir: logs
  store_dir: data/local
  blacklist_json: data/blacklist.json
  etf_to_under_json: data/etf_to_under.json
  etf_ls_universe_json: data/etf_ls_universe.json

# etf-0dte: spx-0dte's SPY / QQQ 0DTE executors (clients 50/51, watchdogs
# 130/131) share this account. An assigned short delivers shares overnight;
# spx-0dte forecasts them at the close in
# <live_dir>/<spy|qqq>/<session>/expected_delivery_<account>.json and sells
# them at 09:30. The classifier labels SPY / QQQ shares against that forecast
# (etf_0dte_delivery) or, with none, as etf_0dte_delivery_unattributed. No
# book here owns either, and nothing here sizes or tickets against them.
etf_0dte:
  # spx-0dte's data/live on this host. ETF_0DTE_LIVE_DIR overrides it.
  # Unset means no forecast.
  live_dir: null
  # Use a product's newest forecast only if at most this many days old.
  forecast_max_age_days: 4
  # Signed SPY / QQQ shares another book is KNOWN to hold, e.g. {SPY: 300}.
  # Those keep their current bucket; only shares beyond them are etf-0dte's.
  # Empty: no book held SPY or QQQ on 2026-10-27, and ls-algo has
  # blacklisted both since 2026-09-10.
  known_share_holdings: {}
